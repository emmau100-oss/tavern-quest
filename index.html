<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tavern Quest</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#4a2c16,transparent 35%),linear-gradient(#1b110a,#0d0906);color:#f1e5c5;font-family:Georgia,serif;min-height:100vh}main{max-width:1050px;margin:auto;padding:20px 14px 60px}h1{font-size:40px;color:#f6d58a;margin:3px 0}h2{margin:5px 0}p{color:#d5c6a8;line-height:1.45}.ey{font-size:11px;text-transform:uppercase;letter-spacing:.17em;color:#c79b58;font-weight:bold}.panel{background:linear-gradient(145deg,#2a1a10ee,#17100bee);border:1px solid #755033;border-radius:14px;padding:16px;margin-bottom:13px;box-shadow:0 10px 25px #0006}.nav{display:flex;gap:6px;overflow:auto;position:sticky;top:0;z-index:5;background:#140e09e8;border:1px solid #68462d;border-radius:12px;padding:8px;margin:15px 0}.nav button,.btn{font-family:inherit;color:#f6e4be;border:1px solid #7b532e;border-radius:8px;padding:10px 12px;background:#2b1b10;cursor:pointer}.nav button.on,.btn{background:linear-gradient(#a97130,#70431d);border-color:#d3a45d;font-weight:bold}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.xp,.bar,.hp{height:10px;background:#090604;border-radius:99px;overflow:hidden}.xp i{display:block;height:100%;background:#8c67be}.bar i{display:block;height:100%;background:#71864c}.hp i{display:block;height:100%;background:#a84035}.small{font-size:11px;color:#a99779}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.stat{background:#100b07;border:1px solid #493421;border-radius:8px;padding:8px;text-align:center}.stat b{display:block;color:#f2cf88}.quest{display:flex;justify-content:space-between;gap:10px;align-items:center}.quest.done{opacity:.5}.who{display:flex;gap:6px;flex-wrap:wrap}.who button{background:#24170e;color:#ecd8b3;border:1px solid #654329;border-radius:7px;padding:7px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.lock{text-align:center;opacity:.65}.nodes{display:flex;gap:7px;overflow:auto;margin:12px 0}.node{min-width:145px;background:#120c08;border:1px solid #4e3522;border-radius:9px;padding:9px}.node.now{border-color:#c6984f}.node.done{opacity:.55}.log{max-height:190px;overflow:auto;background:#0c0805;border-radius:8px;padding:8px;margin-top:8px}.log div{font-size:12px;color:#c8b69b;padding:4px 0;border-bottom:1px solid #ffffff0d}.reward{border:1px solid #b3823e;background:#33200f;border-radius:10px;padding:12px;margin-top:11px}.danger{background:linear-gradient(#99462b,#61301f)!important}.select,input{width:100%;background:#100a07;color:#f3e3c0;border:1px solid #604128;border-radius:7px;padding:9px;font-family:inherit}.label{display:block;color:#c9a569;font-size:11px;text-transform:uppercase;letter-spacing:.1em;margin:10px 0 4px}.qmeta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.pill{display:inline-block;font-size:10px;padding:4px 7px;border:1px solid #654329;border-radius:99px;color:#ccb28b;background:#1a110b}.editor{border:1px solid #9b7441;background:#24170e;border-radius:12px;padding:14px;margin:12px 0}.editorgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.editor textarea{width:100%;min-height:70px;background:#100a07;color:#f3e3c0;border:1px solid #604128;border-radius:7px;padding:9px;font-family:inherit}.subtle{background:#21150d!important;border-color:#604229!important;box-shadow:none!important}.delete{border-color:#824934!important;color:#f0c0aa!important}.toolbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center}@media(max-width:700px){.editorgrid{grid-template-columns:1fr}}@media(max-width:700px){.grid{grid-template-columns:1fr}.quest,.row{align-items:flex-start;flex-direction:column}.quest .who{width:100%}.who button{flex:1}}</style></head><body><main><div class="ey">Two-player household RPG</div><h1>🍺 Tavern Quest</h1><p>Chores make you stronger. Walking carries you to the next danger.</p><div class="nav" id="nav"></div><div id="view"></div></main><script>
const C={Tank:{p:'Bulwark',d:'+30% HP and reduced damage.',hp:1.3,a:1,heal:1},Healer:{p:'Second Wind',d:'Recover more health after battles.',hp:1,a:.9,heal:1.35},Rogue:{p:'Lucky Find',d:'Higher critical-hit and rare-loot chance.',hp:.95,a:1.15,heal:1},Wizard:{p:'Arcane Focus',d:'Spells deal extra damage.',hp:.85,a:.95,heal:1},Ranger:{p:'Pack Bond',d:'Companion abilities are stronger.',hp:1,a:1.05,heal:1},Paladin:{p:'Radiant Guard',d:'Balanced defense with a block chance.',hp:1.15,a:1.05,heal:1.1}};
const P=[['Poe','Loyal Guardian','Blocks attacks'],['Hobie','Tracker of Trails','Improves loot'],['Odin','Steadfast Sentinel','Raises defense'],['Ted','Ironheart','Adds physical power'],['Cloud','Arcane Familiar','Boosts spells'],['Dozer','The Fearless','May strike twice'],['Trousers','Trail Trickster','Improves dodge'],['Bobby','Quickpaw','Acts quickly'],['Boogie','Lucky Paw','May find bonus loot'],['Edgar','Tiny Terror','May interrupt enemies'],['Cheese','Golden Nose','Finds treasure'],['Barriss','Young Vanguard','Scales with the party']];
const I={"Rusty Longsword":['weapon',1],"Iron Shortsword":['weapon',2],"Silvered Dagger":['weapon',3],"Oak Wand":['weapon',2],"Traveler’s Cloak":['armor',1],"Leather Bracers":['armor',2],"Magic Missile":['spell',3],"Cure Wounds":['spell',3],"Burning Hands":['spell',4],"Scroll of Shielding":['spell',2]};
const CAM=[['Blackthorn Keep','The Ashen Warden',5,25,'Poe',78,12,3],['Whispering Fen','The Mire Hag',7,32,'Hobie',105,15,4],['Moonfang Pass','The Frostbound Alpha',9,38,'Cloud',132,18,5],['Sunken Reliquary','The Drowned Knight',12,45,'Dozer',165,22,6],['Cinderpeak Citadel','The Ember Tyrant',15,55,'Barriss',205,26,7]];
const D={tab:'Tavern',players:[{name:'Vaelora',cl:'Ranger',xp:40,comp:null,w:'Rusty Longsword',ar:'Traveler’s Cloak',sp:null,hp:null},{name:'Cellssara',cl:'Tank',xp:35,comp:null,w:'Rusty Longsword',ar:'Traveler’s Cloak',sp:null,hp:null}],quests:[['Replenish the Companions’ Wells','Fill the dogs’ water bowls.',10,'daily','Either'],['Banish the Refuse','Take out the kitchen trash and replace the bag.',10,'daily','Either'],['Restore the Great Hall','Load the dishwasher and wipe the kitchen counters.',15,'daily','Either'],['Tend the Kennels','Pick up the backyard dog waste.',20,'weekly','Either']].map((x,i)=>({id:'starter-'+i,t:x[0],task:x[1],xp:x[2],repeat:x[3],assigned:x[4],done:false,lastCompleted:null})),bag:['Traveler’s Cloak','Rusty Longsword'],un:[],miles:0,ci:0,boss:false,defeated:[],battle:null,choreCount:0,encounterReady:false,innMiles:0,downed:false,editing:null};let S;try{S=Object.assign(structuredClone(D),JSON.parse(localStorage.tq3||'{}'))}catch(e){S=structuredClone(D)};S.quests=(S.quests||[]).map((q,i)=>({...q,id:q.id||('quest-'+Date.now()+'-'+i),repeat:q.repeat||'one-time',assigned:q.assigned||'Either',lastCompleted:q.lastCompleted||null}));
const lv=p=>Math.floor(p.xp/100)+1,max=p=>Math.round((28+lv(p)*8)*C[p.cl].hp),pow=n=>I[n]?.[1]||0,atk=p=>Math.round((5+lv(p)*2+pow(p.w)+(p.sp?pow(p.sp)*C[p.cl].a:0))*C[p.cl].a),def=p=>Math.round(2+lv(p)+pow(p.ar));function save(){localStorage.tq3=JSON.stringify(S)}function hp(){S.players.forEach(p=>{if(p.hp==null||p.hp>max(p))p.hp=max(p)})}
function dayKey(d=new Date()){return d.toISOString().slice(0,10)}function weekKey(d=new Date()){let x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())),n=x.getUTCDay()||7;x.setUTCDate(x.getUTCDate()+4-n);let y=new Date(Date.UTC(x.getUTCFullYear(),0,1));return x.getUTCFullYear()+'-W'+String(Math.ceil((((x-y)/86400000)+1)/7)).padStart(2,'0')}function refreshQuests(){let changed=false;for(const q of S.quests){if(!q.done||!q.lastCompleted)continue;if(q.repeat==='daily'&&q.lastCompleted!==dayKey()){q.done=false;changed=true}if(q.repeat==='weekly'&&q.lastCompleted!==weekKey()){q.done=false;changed=true}}if(changed)save()}function editQuest(i){S.editing=i;render()}function addQuest(){S.editing='new';render()}function cancelQuest(){S.editing=null;render()}function storeQuest(i){let t=document.getElementById('qt').value.trim(),task=document.getElementById('qtask').value.trim(),xp=Math.max(1,parseInt(document.getElementById('qxp').value)||10),repeat=document.getElementById('qrepeat').value,assigned=document.getElementById('qassigned').value;if(!t||!task){alert('Add both a fantasy quest title and the real chore.');return}let q={id:'q-'+Date.now(),t,task,xp,repeat,assigned,done:false,lastCompleted:null};if(i==='new')S.quests.unshift(q);else S.quests[i]={...S.quests[i],t,task,xp,repeat,assigned};S.editing=null;save();render()}function removeQuest(i){if(confirm('Remove this quest?')){S.quests.splice(i,1);S.editing=null;save();render()}}hp();refreshQuests();
function nav(){let ts=['Tavern','Quest Board','Journey','Companions','Inventory'];nav.innerHTML=ts.map(t=>`<button class="${S.tab===t?'on':''}" onclick="S.tab='${t}';save();render()">${t}</button>`).join('')}
function card(p,i){let owned=P.filter(x=>S.un.includes(x[0]));return `<div class="panel"><div class="row"><div><div class="ey">Adventurer</div><input value="${p.name}" onchange="S.players[${i}].name=this.value;save()"></div><b>Lv ${lv(p)}</b></div><div class="xp"><i style="width:${p.xp%100}%"></i></div><div class="small">${p.xp%100}/100 XP</div><span class="label">Class</span><select class="select" onchange="S.players[${i}].cl=this.value;S.players[${i}].hp=null;hp();save();render()">${Object.keys(C).map(c=>`<option ${c===p.cl?'selected':''}>${c}</option>`).join('')}</select><p><b>${C[p.cl].p}</b> — ${C[p.cl].d}</p><div class="statgrid"><div class="stat"><b>${p.hp}/${max(p)}</b><small>${p.hp<=0?'DOWNED':'HP'}</small></div><div class="stat"><b>${atk(p)}</b><small>Attack</small></div><div class="stat"><b>${def(p)}</b><small>Defense</small></div></div><span class="label">Active companion</span>${owned.length?`<select class="select" onchange="S.players[${i}].comp=this.value||null;save();render()"><option value="">None</option>${owned.map(x=>`<option ${x[0]===p.comp?'selected':''}>${x[0]}</option>`).join('')}</select>`:`<div class="small">🔒 No companion earned yet.</div>`}</div>`}
function complete(q,i){let z=S.quests[q];if(z.done)return;if(z.assigned!=='Either'&&z.assigned!==String(i))return;z.done=true;z.lastCompleted=z.repeat==='weekly'?weekKey():dayKey();S.players[i].xp+=z.xp;S.choreCount=(S.choreCount||0)+1;if(S.choreCount>=3)S.encounterReady=true;hp();save();render()}
function fight(kind){
  hp();
  if(S.downed||S.players.some(p=>p.hp<=0)){S.downed=true;save();render();return}
  if(kind==='random'&&!S.encounterReady)return;
  let st=CAM[S.ci],e=kind==='boss'?{n:st[1],hp:st[5],a:st[6],d:st[7]}:{n:['Cellar Goblins','Mire Wolves','Bog Sprites','Roadside Bandits'][Math.floor(Math.random()*4)],hp:38+S.ci*10,a:8+S.ci*2,d:2+S.ci},ph=S.players.map(p=>p.hp),eh=e.hp,L=[];
  if(kind==='random'){S.encounterReady=false;S.choreCount=0}
  for(let r=1;r<14&&eh>0&&ph.some(x=>x>0);r++){
    S.players.forEach((p,i)=>{if(ph[i]<=0||eh<=0)return;let d=Math.max(1,Math.round(atk(p)-e.d+Math.random()*5));if(p.cl==='Rogue'&&Math.random()<.22){d*=2;L.push(`🗡️ ${p.name} critical hit!`)}if(p.comp==='Dozer'&&Math.random()<.18){d+=Math.round(d*.7);L.push(`🐾 Dozer attacks too!`)}if(p.comp==='Cloud'&&p.sp)d+=2;eh-=d;L.push(`${p.name} deals ${d} damage.`)});
    if(eh<=0)break;
    let ids=ph.map((x,i)=>x>0?i:-1).filter(i=>i>=0),i=ids[Math.floor(Math.random()*ids.length)],p=S.players[i],blocked=(p.comp==='Poe'&&Math.random()<.25)||(p.cl==='Paladin'&&Math.random()<.15);
    if(blocked)L.push(`🛡️ ${p.name} blocks the attack.`);else{let d=Math.max(1,Math.round(e.a+Math.random()*4-def(p)));if(p.cl==='Tank')d=Math.max(1,Math.round(d*.85));ph[i]=Math.max(0,ph[i]-d);L.push(`${e.n} hits ${p.name} for ${d}.`)}
  }
  S.players.forEach((p,i)=>p.hp=Math.max(0,ph[i]));
  let win=eh<=0;
  if(win){
    if(kind==='boss'){S.boss=true;if(!S.defeated.includes(st[1]))S.defeated.push(st[1]);if(!S.un.includes(st[4]))S.un.push(st[4]);S.battle={win:1,item:st[4],log:L,boss:1}}
    else{let pool=['Iron Shortsword','Leather Bracers','Oak Wand','Magic Missile','Cure Wounds','Burning Hands'],it=pool[Math.floor(Math.random()*pool.length)];if(!S.bag.includes(it))S.bag.push(it);S.battle={win:1,item:it,log:L}}
  }else S.battle={win:0,log:L};
  if(S.players.some(p=>p.hp<=0)){S.downed=true;S.innMiles=0;L.push('☠️ A party member has fallen. The party must reach an inn 10 miles away.')}
  save();render()
}
function walk(n){
  if(S.downed){S.innMiles=Math.min(10,(S.innMiles||0)+n);if(S.innMiles>=10){S.players.forEach(p=>p.hp=max(p));S.downed=false;S.innMiles=0;S.battle={win:1,item:'Full rest at The Weary Wyvern Inn',log:['🏚️ The party reaches the inn. Everyone is restored to full health.']}}}
  else {let st=CAM[S.ci];S.miles=Math.min(st[3],S.miles+n)}
  save();render()
}
function next(){if(S.ci<CAM.length-1){S.ci++;S.miles=0;S.boss=false;S.battle=null;save();render()}}
function equip(n,i){let t=I[n][0];if(t==='weapon')S.players[i].w=n;if(t==='armor')S.players[i].ar=n;if(t==='spell')S.players[i].sp=n;save();render()}
function render(){nav();let h='';if(S.tab==='Tavern')h=`<div class="panel"><div class="ey">Tonight at the Hearth</div><h2>Your next chapter awaits.</h2><p>Complete real household chores for XP. Walking moves the party toward the next boss. Classes, equipment, spells and earned companions affect combat.</p></div><div class="grid">${card(S.players[0],0)}${card(S.players[1],1)}</div>`;
if(S.tab==='Quest Board'){let E=S.editing,eq=E==='new'?{t:'',task:'',xp:10,repeat:'daily',assigned:'Either'}:(typeof E==='number'?S.quests[E]:null);h=`<div class="row"><div><div class="ey">Pinned beside the hearth</div><h2>Quest Board</h2></div><div class="toolbar"><span class="small">Encounter progress: ${Math.min(S.choreCount||0,3)} / 3 chores</span><button class="btn" onclick="addQuest()">+ Add Quest</button></div></div>${eq?`<div class="editor"><div class="ey">${E==='new'?'Create a household quest':'Edit household quest'}</div><div class="editorgrid"><div><span class="label">Fantasy title</span><input id="qt" value="${eq.t.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}"><span class="label">Actual chore</span><textarea id="qtask">${eq.task}</textarea></div><div><span class="label">XP reward</span><input id="qxp" type="number" min="1" value="${eq.xp}"><span class="label">Repeat</span><select id="qrepeat" class="select"><option value="daily" ${eq.repeat==='daily'?'selected':''}>Daily</option><option value="weekly" ${eq.repeat==='weekly'?'selected':''}>Weekly</option><option value="one-time" ${eq.repeat==='one-time'?'selected':''}>One-time</option></select><span class="label">Assigned to</span><select id="qassigned" class="select"><option value="Either" ${eq.assigned==='Either'?'selected':''}>Either player</option><option value="0" ${eq.assigned==='0'?'selected':''}>${S.players[0].name}</option><option value="1" ${eq.assigned==='1'?'selected':''}>${S.players[1].name}</option></select></div></div><div class="toolbar" style="margin-top:12px"><button class="btn" onclick="storeQuest(${E==='new'?"'new'":E})">Save Quest</button><button class="btn subtle" onclick="cancelQuest()">Cancel</button>${E!=='new'?`<button class="btn subtle delete" onclick="removeQuest(${E})">Delete</button>`:''}</div></div>`:''}${S.quests.map((q,i)=>{let buttons='';if(!q.done){let allow0=q.assigned==='Either'||q.assigned==='0',allow1=q.assigned==='Either'||q.assigned==='1';buttons=`<div class="who">${allow0?`<button onclick="complete(${i},0)">${S.players[0].name} did it</button>`:''}${allow1?`<button onclick="complete(${i},1)">${S.players[1].name} did it</button>`:''}</div>`}return `<div class="panel quest ${q.done?'done':''}"><div><h3>${q.t}</h3><p>${q.task}</p><div class="qmeta"><span class="pill">+${q.xp} XP</span><span class="pill">${q.repeat==='one-time'?'One-time':q.repeat[0].toUpperCase()+q.repeat.slice(1)}</span><span class="pill">${q.assigned==='Either'?'Either':S.players[Number(q.assigned)]?.name||'Either'}</span></div></div><div>${q.done?'✓ Complete':buttons}<div style="margin-top:7px;text-align:right"><button class="btn subtle" onclick="editQuest(${i})">Edit</button></div></div></div>`}).join('')}`}
if(S.tab==='Journey'){let st=CAM[S.ci],pct=Math.min(100,S.miles/st[3]*100),innPct=Math.min(100,(S.innMiles||0)/10*100);h=`<div class="panel"><div class="ey">${S.downed?'Recovery Journey':'Main Quest • Chapter '+(S.ci+1)}</div><h2>${S.downed?'Road to The Weary Wyvern Inn':'Road to '+st[0]}</h2>${S.downed?`<div class="reward"><h3>☠️ A party member has fallen</h3><p>Combat is locked until the party reaches the inn. Chores can still be completed and still award XP.</p><div class="bar"><i style="width:${innPct}%"></i></div><p><b>${(S.innMiles||0).toFixed(1)} / 10 miles to the inn</b></p><button class="btn" onclick="walk(2)">Demo: Walk 2 Miles</button></div>`:`<div class="nodes">${CAM.map((x,i)=>`<div class="node ${i===S.ci?'now':''} ${S.defeated.includes(x[1])?'done':''}"><b>Chapter ${i+1}</b><div>${x[0]}</div><span class="small">${S.defeated.includes(x[1])?'✓ Complete':i===S.ci?'Current':'Locked'}</span></div>`).join('')}</div><p>Walk <b>${st[3]} miles</b> to reach the next boss. Walking never gives XP.</p><div class="bar"><i style="width:${pct}%"></i></div><p><b>${S.miles.toFixed(1)} / ${st[3]} miles</b></p><button class="btn" onclick="walk(2)">Demo: Add Walking</button>${S.miles>=st[3]&&!S.boss?`<div class="reward"><h3>🔥 ${st[1]} — Level ${st[2]}</h3><p>You may fight now or keep leveling with chores. A major companion reward is hidden behind this victory.</p><button class="btn danger" onclick="fight('boss')">Challenge Boss</button></div>`:''}${S.boss?`<div class="reward"><h3>🏆 Major Victory</h3><p>🐾 <b>${st[4]}</b> has joined your companion roster.</p>${S.ci<CAM.length-1?`<button class="btn" onclick="next()">Begin Next Chapter</button>`:'<b>Campaign complete!</b>'}</div>`:''}`}</div><div class="panel"><h3>🎲 Random Encounter</h3><p>Complete <b>3 chores</b> to unlock one encounter. Attempting it uses the encounter whether you win or lose.</p><div class="bar"><i style="width:${Math.min(100,(S.choreCount||0)/3*100)}%"></i></div><p><b>${Math.min(S.choreCount||0,3)} / 3 chores completed</b></p>${S.downed?`<button class="btn" disabled>🔒 Reach the inn first</button>`:S.encounterReady?`<button class="btn" onclick="fight('random')">⚠️ Enter Random Encounter</button>`:`<button class="btn" disabled>🔒 Encounter Locked</button>`}${S.battle?`<div class="reward"><b>${S.battle.win?'Victory! Reward: '+S.battle.item:'Defeat — your HP damage remains.'}</b><div class="log">${S.battle.log.map(x=>`<div>${x}</div>`).join('')}</div></div>`:''}</div>`}
if(S.tab==='Companions')h=`<div class="row"><div><div class="ey">Household Allies</div><h2>Companions</h2></div><span class="small">One active each • boss rewards</span></div><div class="cards">${P.map(x=>S.un.includes(x[0])?`<div class="panel"><h3>🐾 ${x[0]}</h3><b>${x[1]}</b><p>${x[2]}</p><div class="who"><button onclick="S.players[0].comp='${x[0]}';save();render()">Equip to ${S.players[0].name}</button><button onclick="S.players[1].comp='${x[0]}';save();render()">Equip to ${S.players[1].name}</button></div></div>`:`<div class="panel lock"><h2>🔒</h2><h3>???</h3><p>An unknown household companion awaits a major victory.</p></div>`).join('')}</div>`;
if(S.tab==='Inventory')h=`<h2>Inventory & Spellbook</h2><div class="grid"><div>${S.players.map((p,i)=>`<div class="panel"><h3>${p.name}</h3><p>Weapon: <b>${p.w}</b><br>Armor: <b>${p.ar}</b><br>Spell: <b>${p.sp||'None'}</b></p></div>`).join('')}</div><div class="cards">${S.bag.map(n=>`<div class="panel"><h3>${n}</h3><p>${I[n]?.[0]||'item'} • power ${I[n]?.[1]||1}</p>${I[n]?`<div class="who"><button onclick="equip('${n}',0)">Equip: ${S.players[0].name}</button><button onclick="equip('${n}',1)">Equip: ${S.players[1].name}</button></div>`:''}</div>`).join('')}</div></div>`;view.innerHTML=h}render();</script></body></html>
