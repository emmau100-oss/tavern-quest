S.players.forEach(p=>{if(!p.classXP){p.classXP={};Object.keys(C).forEach(c=>p.classXP[c]=0);p.classXP[p.cl]=Number(p.xp||0)}else Object.keys(C).forEach(c=>{if(p.classXP[c]==null)p.classXP[c]=0});p.xp=Number(p.classXP[p.cl]||0)});
const classXP=(p,c=p.cl)=>Number(p.classXP?.[c]||0),lv=(p,c=p.cl)=>Math.floor(classXP(p,c)/100)+1,max=p=>Math.round((28+lv(p)*8)*C[p.cl].hp),pow=n=>I[n]?.[1]||0,atk=p=>Math.round((5+lv(p)*2+pow(p.w)+(p.sp?pow(p.sp)*C[p.cl].a:0))*C[p.cl].a),def=p=>Math.round(2+lv(p)+pow(p.ar));function save(){localStorage.tq3=JSON.stringify(S)}function hp(){S.players.forEach(p=>{if(p.hp==null||p.hp>max(p))p.hp=max(p)})}
function dayKey(d=new Date()){return d.toISOString().slice(0,10)}function weekKey(d=new Date()){let x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())),n=x.getUTCDay()||7;x.setUTCDate(x.getUTCDate()+4-n);let y=new Date(Date.UTC(x.getUTCFullYear(),0,1));return x.getUTCFullYear()+'-W'+String(Math.ceil((((x-y)/86400000)+1)/7)).padStart(2,'0')}function refreshQuests(){let changed=false;for(const q of S.quests){if(!q.done||!q.lastCompleted)continue;if(q.repeat==='daily'&&q.lastCompleted!==dayKey()){q.done=false;changed=true}if(q.repeat==='weekly'&&q.lastCompleted!==weekKey()){q.done=false;changed=true}}if(changed)save()}function editQuest(i){S.editing=i;render()}function addQuest(){S.editing='new';render()}function cancelQuest(){S.editing=null;render()}function storeQuest(i){let t=document.getElementById('qt').value.trim(),task=document.getElementById('qtask').value.trim(),xp=Math.max(1,parseInt(document.getElementById('qxp').value)||10),repeat=document.getElementById('qrepeat').value,assigned=document.getElementById('qassigned').value;if(!t||!task){alert('Add both a fantasy quest title and the real chore.');return}let q={id:'q-'+Date.now(),t,task,xp,repeat,assigned,done:false,lastCompleted:null};if(i==='new')S.quests.unshift(q);else S.quests[i]={...S.quests[i],t,task,xp,repeat,assigned};S.editing=null;save();render()}function removeQuest(i){if(confirm('Remove this quest?')){S.quests.splice(i,1);S.editing=null;save();render()}}hp();refreshQuests();


let AC=null,ambienceNodes=[],musicTimer=null,musicStep=0;
function audioCtx(){if(!AC){let X=window.AudioContext||window.webkitAudioContext;if(!X)return null;AC=new X()}if(AC.state==='suspended')AC.resume();return AC}
function tone(freq=440,dur=.12,type='sine',vol=.05,delay=0){if(!S.soundOn)return;let a=audioCtx();if(!a)return;let o=a.createOscillator(),g=a.createGain(),t=a.currentTime+delay;o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.03)}
function musicTone(freq,dur=.42,vol=.045,delay=0){let a=audioCtx();if(!a||!S.ambienceOn)return;let o=a.createOscillator(),g=a.createGain(),t=a.currentTime+delay;o.type='triangle';o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.018);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.04)}
function noise(dur=.12,vol=.025,delay=0){if(!S.soundOn)return;let a=audioCtx();if(!a)return;let n=Math.max(1,Math.floor(a.sampleRate*dur)),buf=a.createBuffer(1,n,a.sampleRate),d=buf.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);let src=a.createBufferSource(),g=a.createGain(),t=a.currentTime+delay;src.buffer=buf;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);src.connect(g);g.connect(a.destination);src.start(t)}
function sfx(name){if(!S.soundOn)return;audioCtx();switch(name){
case'click':tone(260,.055,'triangle',.018);break;
case'quest':tone(523,.1,'triangle',.045);tone(659,.12,'triangle',.04,.09);tone(784,.18,'triangle',.035,.18);break;
case'dice':noise(.08,.035);noise(.08,.03,.09);noise(.08,.025,.18);tone(160,.08,'square',.018,.23);break;
case'hit':noise(.09,.045);tone(105,.1,'square',.025);break;
case'spell':tone(440,.08,'sine',.025);tone(660,.1,'sine',.03,.07);tone(990,.15,'sine',.025,.15);break;
case'victory':tone(392,.12,'triangle',.04);tone(523,.14,'triangle',.045,.11);tone(659,.18,'triangle',.04,.23);tone(784,.28,'triangle',.045,.37);break;
case'loot':tone(880,.08,'sine',.035);tone(1175,.12,'sine',.03,.08);break;
case'defeat':tone(220,.16,'sawtooth',.03);tone(174,.22,'sawtooth',.025,.14);tone(130,.35,'sawtooth',.02,.32);break;
case'boss':tone(98,.22,'sawtooth',.04);tone(123,.25,'sawtooth',.035,.2);tone(82,.38,'sawtooth',.045,.44);noise(.35,.025,.44);break;
case'companion':tone(523,.12,'triangle',.04);tone(659,.12,'triangle',.04,.1);tone(784,.12,'triangle',.04,.2);tone(1047,.35,'sine',.04,.32);break;
case'inn':tone(330,.14,'sine',.03);tone(392,.18,'sine',.03,.13);tone(494,.3,'sine',.025,.28);break;
}}
function stopAmbience(){if(musicTimer){clearInterval(musicTimer);musicTimer=null}ambienceNodes.forEach(n=>{try{n.stop?.();n.disconnect?.()}catch(e){}});ambienceNodes=[]}
function playMusicPhrase(){if(!S.ambienceOn)return;const melody=[293.66,349.23,392,440,392,349.23,329.63,293.66,261.63,293.66,329.63,392,349.23,329.63,293.66,261.63];const bass=[146.83,174.61,196,130.81];let i=musicStep%melody.length;musicTone(melody[i],.44,.044);if(i%2===0)musicTone(melody[(i+2)%melody.length]/2,.5,.014,.035);if(i%4===0)musicTone(bass[(i/4)%bass.length],1.1,.018);musicStep++}
function startAmbience(){if(!S.ambienceOn)return;stopAmbience();let a=audioCtx();if(!a)return;let master=a.createGain();master.gain.value=.006;master.connect(a.destination);let n=Math.floor(a.sampleRate*2),buf=a.createBuffer(1,n,a.sampleRate),d=buf.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(.35+Math.random()*.25);let src=a.createBufferSource(),filter=a.createBiquadFilter(),g=a.createGain();src.buffer=buf;src.loop=true;filter.type='lowpass';filter.frequency.value=430;g.gain.value=.32;src.connect(filter);filter.connect(g);g.connect(master);src.start();ambienceNodes=[src,filter,g,master];musicStep=0;playMusicPhrase();musicTimer=setInterval(playMusicPhrase,520)}

const FITNESS_URL='https://ilmjnptsepcztzwnvrap.supabase.co/functions/v1/tavern-fitness';
function isoDate(d){return d.toISOString().slice(0,10)}
function weekBounds(){let d=new Date(),u=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())),day=u.getUTCDay()||7;u.setUTCDate(u.getUTCDate()-day+1);let e=new Date(u);e.setUTCDate(e.getUTCDate()+6);return [isoDate(u),isoDate(e)]}
async function syncFitness(){
  try{
    const r=await fetch(FITNESS_URL,{cache:'no-store'}),j=await r.json();
    if(!r.ok||!j.ok)throw new Error(j.error||'Fitness sync failed');
    const samples=j.samples||[];let all=0,weekly=0,by={vaelora:0,cellssara:0};const [ws,we]=weekBounds();
    for(const x of samples){let m=Number(x.distance_miles)||0;all+=m;if(x.sample_date>=ws&&x.sample_date<=we){weekly+=m;if(by[x.player]!=null)by[x.player]+=m}}
    S.fitnessAllTime=all;S.fitnessWeekly=weekly;S.fitnessByPlayer=by;S.fitnessUpdated=new Date().toISOString();
    if(S.downed){if(S.innStartTotal==null)S.innStartTotal=all;S.innMiles=Math.max(0,Math.min(10,all-S.innStartTotal));if(S.innMiles>=10){S.players.forEach(p=>p.hp=max(p));S.downed=false;S.innMiles=0;S.innStartTotal=null;S.battle={win:1,item:'Full rest at The Weary Wyvern Inn',log:['🏚️ The party reaches the inn. Everyone is restored to full health.']};sfx('inn')}}
    else S.miles=weekly;
    save();render();
  }catch(e){S.fitnessError=String(e.message||e);save();render()}
}

function changeClass(i,c){let p=S.players[i],oldMax=max(p),ratio=oldMax?Math.max(0,p.hp)/oldMax:1;p.cl=c;p.xp=classXP(p);p.hp=Math.min(max(p),Math.round(max(p)*ratio));save();render()}
function complete(q,i){let z=S.quests[q];if(z.done)return;if(z.assigned!=='Either'&&z.assigned!==String(i))return;z.done=true;z.lastCompleted=z.repeat==='weekly'?weekKey():dayKey();let p=S.players[i];p.classXP[p.cl]=classXP(p)+z.xp;p.xp=p.classXP[p.cl];S.choreCount=(S.choreCount||0)+1;if(S.choreCount>=3)S.encounterReady=true;sfx('quest');hp();save();render()}
function startBattle(kind){
  hp();if(S.downed||S.players.some(p=>p.hp<=0)){S.downed=true;save();render();return}if(kind==='random'&&!S.encounterReady)return;
  let st=CAM[S.ci],pick=kind==='random'?ENC[Math.floor(Math.random()*ENC.length)]:null,scale=S.ci,enemy=kind==='boss'?{name:st[1],maxHp:st[5],hp:st[5],attack:st[6],defense:st[7],level:st[2],trait:'Boss',traitDesc:'A major foe with enhanced health and power.',flavor:`The road ends before ${st[1]}. There is no mistaking the challenge.`}:{name:pick.name,maxHp:pick.hp+scale*11,hp:pick.hp+scale*11,attack:pick.atk+scale*2,defense:pick.def+scale,level:pick.lv+scale*2,trait:pick.trait,traitDesc:pick.desc,flavor:pick.flavor};
  if(kind==='random'){S.encounterReady=false;S.choreCount=0}
  S.battle={active:true,kind,enemy,turn:0,round:1,defending:[false,false],compUsed:[false,false],log:[`📖 ${enemy.flavor}`,`⚔️ ${enemy.name} enters battle!`,`⚠️ Trait: ${enemy.trait} — ${enemy.traitDesc}`],win:null,item:null};sfx(kind==='boss'?'boss':'dice');save();render()
}
function battleAction(type){let b=S.battle;if(!b?.active)return;let living=S.players.map((p,i)=>p.hp>0?i:-1).filter(i=>i>=0);if(!living.length)return finishBattle(false);let i=living.includes(b.turn)?b.turn:living[0],p=S.players[i],e=b.enemy,base=Math.max(1,atk(p)-e.defense+Math.floor(Math.random()*5)),dmg=0;
  if(type==='attack'){dmg=base;if(p.cl==='Rogue'&&Math.random()<.22){dmg*=2;b.log.push(`🗡️ ${p.name} lands a critical hit!`)}b.log.push(`⚔️ ${p.name} attacks for ${dmg}.`);sfx('hit')}
  if(type==='defend'){b.defending[i]=true;b.log.push(`🛡️ ${p.name} braces for the next attack.`);sfx('click')}
  if(type==='class'){
    if(p.cl==='Tank'){b.defending[i]=true;dmg=Math.max(1,Math.round(base*.7));b.log.push(`🛡️ ${p.name} uses Bulwark Bash for ${dmg} and guards.`)}
    else if(p.cl==='Healer'){let heal=Math.round(8+lv(p)*3);S.players.forEach(x=>{if(x.hp>0)x.hp=Math.min(max(x),x.hp+heal)});b.log.push(`✨ ${p.name} restores ${heal} HP to the party.`);sfx('spell')}
    else if(p.cl==='Rogue'){dmg=Math.round(base*1.5);b.log.push(`🗡️ ${p.name} uses Sneak Attack for ${dmg}.`);sfx('hit')}
    else if(p.cl==='Wizard'){dmg=Math.round((8+lv(p)*3+(p.sp?pow(p.sp)*2:0))*1.15);b.log.push(`🔮 ${p.name} unleashes Arcane Burst for ${dmg}.`);sfx('spell')}
    else if(p.cl==='Ranger'){dmg=Math.round(base*1.15+(p.comp?4+lv(p):0));b.log.push(`🏹 ${p.name} uses Hunter's Mark for ${dmg}${p.comp?' with companion aid':''}.`);sfx('hit')}
    else if(p.cl==='Paladin'){dmg=Math.round(base*.9);let heal=4+lv(p);p.hp=Math.min(max(p),p.hp+heal);b.log.push(`⚔️ ${p.name} uses Radiant Strike for ${dmg} and heals ${heal}.`);sfx('spell')}
  }
  if(type==='spell'){if(!p.sp){b.log.push(`📜 ${p.name} has no spell equipped.`);return render()}if(p.sp==='Cure Wounds'){let heal=10+lv(p)*2;p.hp=Math.min(max(p),p.hp+heal);b.log.push(`💚 ${p.name} casts Cure Wounds and heals ${heal}.`)}else if(p.sp==='Scroll of Shielding'){b.defending[i]=true;b.log.push(`🛡️ ${p.name} casts Shielding.`)}else{dmg=Math.round(6+pow(p.sp)*3+lv(p)*(p.cl==='Wizard'?3:2));b.log.push(`✨ ${p.name} casts ${p.sp} for ${dmg}.`)}sfx('spell')}
  if(type==='companion'){if(!p.comp||b.compUsed[i]){b.log.push(`🐾 No companion action is available.`);return render()}b.compUsed[i]=true;dmg=5+lv(p)+(p.cl==='Ranger'?4:0);if(p.comp==='Poe'){b.defending[i]=true;b.log.push(`🐾 Poe guards ${p.name} and attacks for ${dmg}.`)}else if(p.comp==='Dozer')dmg*=2;else if(p.comp==='Cloud'&&p.sp)dmg+=5;b.log.push(`🐾 ${p.comp} joins the fight for ${dmg} damage!`);sfx('hit')}
  if(dmg>0){if(e.trait==='Bone Armor'&&type==='attack'){let before=dmg;dmg=Math.max(1,Math.round(dmg*.78));if(dmg<before)b.log.push(`🦴 Bone Armor reduces the blow to ${dmg}.`)}if(e.trait==='Hexing Sparks'&&Math.random()<.15&&type!=='defend'){dmg=Math.max(1,Math.round(dmg*.7));b.log.push('✨ Hexing Sparks weaken the attack.')}e.hp=Math.max(0,e.hp-dmg)}if(e.hp<=0)return finishBattle(true);
  enemyTurn();if(S.players.every(x=>x.hp<=0))return finishBattle(false);
  let next=(i+1)%S.players.length;if(S.players[next].hp<=0)next=i;b.turn=next;if(next===0)b.round++;save();render()
}
function enemyTurn(){let b=S.battle,e=b.enemy,ids=S.players.map((p,i)=>p.hp>0?i:-1).filter(i=>i>=0);if(!ids.length)return;let i=ids[Math.floor(Math.random()*ids.length)],p=S.players[i],blocked=(p.comp==='Poe'&&Math.random()<.18)||(p.cl==='Paladin'&&Math.random()<.12);if(blocked){b.log.push(`🛡️ ${p.name} blocks ${e.name}'s attack.`);return}let armor=def(p),raw=Math.max(1,Math.round(e.attack+Math.random()*5-armor));if(e.trait==='Dirty Fighting'&&Math.random()<.25){raw=Math.max(raw,Math.round(e.attack*.8));b.log.push('🗡️ Dirty Fighting slips past part of the party’s defense.')}if(e.trait==='Pack Hunter'&&p.hp<max(p)*.55)raw=Math.round(raw*1.3);if(e.trait==='Maul'&&Math.random()<.18){raw=Math.round(raw*1.8);b.log.push('🐻 A brutal Maul crashes into the party!')}if(b.defending[i]){raw=Math.max(1,Math.round(raw*.45));b.defending[i]=false}if(p.cl==='Tank')raw=Math.max(1,Math.round(raw*.82));p.hp=Math.max(0,p.hp-raw);b.log.push(`💥 ${e.name} hits ${p.name} for ${raw}.`);if(e.trait==='Swarm'&&Math.random()<.22&&p.hp>0){let extra=Math.max(1,Math.round(raw*.4));p.hp=Math.max(0,p.hp-extra);b.log.push(`👥 The swarm lands another hit for ${extra}.`)}if(e.trait==='Dark Mend'&&Math.random()<.2&&e.hp>0){let heal=Math.min(9,e.maxHp-e.hp);e.hp+=heal;if(heal>0)b.log.push(`🕯️ Dark energy restores ${heal} HP to ${e.name}.`)}sfx('hit')}
function finishBattle(win){let b=S.battle,st=CAM[S.ci];b.active=false;b.win=win?1:0;if(win){if(b.kind==='boss'){S.boss=true;if(!S.defeated.includes(st[1]))S.defeated.push(st[1]);if(!S.un.includes(st[4]))S.un.push(st[4]);b.item=st[4];b.log.push(`🏆 ${st[1]} falls. ${st[4]} is unlocked!`);sfx('companion')}else{let pool=['Iron Shortsword','Leather Bracers','Oak Wand','Magic Missile','Cure Wounds','Burning Hands'],it=pool[Math.floor(Math.random()*pool.length)];if(!S.bag.includes(it))S.bag.push(it);b.item=it;b.log.push(`🎁 Victory! Found ${it}.`);sfx('victory');setTimeout(()=>sfx('loot'),260)}}else{b.log.push('☠️ The party is defeated and retreats.');sfx('defeat')}
  if(S.players.some(p=>p.hp<=0)){S.downed=true;S.innMiles=0;S.innStartTotal=S.fitnessAllTime||0;b.log.push('🏚️ A party member is down. The Weary Wyvern Inn is 10 miles away.')}save();render()
}
function walk(n){
  if(S.downed){S.innMiles=Math.min(10,(S.innMiles||0)+n);if(S.innMiles>=10){S.players.forEach(p=>p.hp=max(p));S.downed=false;S.innMiles=0;S.battle={win:1,item:'Full rest at The Weary Wyvern Inn',log:['🏚️ The party reaches the inn. Everyone is restored to full health.']};sfx('inn')}}
  else {let st=CAM[S.ci];S.miles=Math.min(st[3],S.miles+n)}
  save();render()
}
function next(){sfx('click');if(S.ci<CAM.length-1){S.ci++;S.miles=0;S.boss=false;S.battle=null;save();render()}}
function equip(n,i){sfx('loot');let t=I[n][0];if(t==='weapon')S.players[i].w=n;if(t==='armor')S.players[i].ar=n;if(t==='spell')S.players[i].sp=n;save();render()}
function battleUI(){let b=S.battle;if(!b)return '';if(b.active){let p=S.players[b.turn],e=b.enemy,pct=Math.max(0,e.hp/e.maxHp*100);return `<div class=\"battlebox\"><div class=\"ey\">Turn-Based Battle • Round ${b.round}</div><h3 class=\"encountername\">${e.name} • Lv ${e.level}</h3><p>${e.flavor||''}</p><div class=\"encountertrait\"><b>⚠️ ${e.trait||'Unknown Trait'}</b> — ${e.traitDesc||'Watch your footing.'}</div><div class=\"hp enemyhp\"><i style=\"width:${pct}%\"></i></div><p><b>${e.hp} / ${e.maxHp} enemy HP</b></p><div class=\"combatants\">${S.players.map((x,i)=>`<div class=\"combatant\"><b>${x.name}</b> • ${x.cl} Lv ${lv(x)}<div class=\"hp\"><i style=\"width:${Math.max(0,x.hp/max(x)*100)}%\"></i></div><span class=\"small\">${x.hp}/${max(x)} HP ${i===b.turn&&x.hp>0?'• YOUR TURN':''}</span></div>`).join('')}</div><p><b>${p?.name||'Party'}'s turn</b></p><div class=\"actions\"><button class=\"btn\" onclick=\"battleAction('attack')\">⚔️ Attack</button><button class=\"btn subtle\" onclick=\"battleAction('defend')\">🛡️ Defend</button><button class=\"btn\" onclick=\"battleAction('class')\">✨ ${p?C[p.cl].p:'Class Ability'}</button><button class=\"btn subtle\" onclick=\"battleAction('spell')\">🔮 Spell</button><button class=\"btn subtle\" onclick=\"battleAction('companion')\" ${p?.comp?'':'disabled'}>🐾 Companion</button></div><div class=\"log\">${b.log.slice(-12).reverse().map(x=>`<div>${x}</div>`).join('')}</div></div>`}return `<div class=\"reward\"><b>${b.win?'Victory!'+(b.item?' Reward: '+b.item:''):'Defeat — your remaining HP carries forward.'}</b><div class=\"log\">${b.log.slice(-16).reverse().map(x=>`<div>${x}</div>`).join('')}</div></div>`}
function render(){nav();let h='';if(S.tab==='Tavern')h=`<div class="panel"><div class="ey">Tonight at the Hearth</div><h2>Your next chapter awaits.</h2><p>Complete real household chores for XP. Walking moves the party toward the next boss. Classes, equipment, spells and earned companions affect combat.</p></div><div class="grid">${card(S.players[0],0)}${card(S.players[1],1)}</div>`;
if(S.tab==='Quest Board'){let E=S.editing,eq=E==='new'?{t:'',task:'',xp:10,repeat:'daily',assigned:'Either'}:(typeof E==='number'?S.quests[E]:null);h=`<div class="row"><div><div class="ey">Pinned beside the hearth</div><h2>Quest Board</h2></div><div class="toolbar"><span class="small">Encounter progress: ${Math.min(S.choreCount||0,3)} / 3 chores</span><button class="btn" onclick="addQuest()">+ Add Quest</button></div></div>${eq?`<div class="editor"><div class="ey">${E==='new'?'Create a household quest':'Edit household quest'}</div><div class="editorgrid"><div><span class="label">Fantasy title</span><input id="qt" value="${eq.t.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}"><span class="label">Actual chore</span><textarea id="qtask">${eq.task}</textarea></div><div><span class="label">XP reward</span><input id="qxp" type="number" min="1" value="${eq.xp}"><span class="label">Repeat</span><select id="qrepeat" class="select"><option value="daily" ${eq.repeat==='daily'?'selected':''}>Daily</option><option value="weekly" ${eq.repeat==='weekly'?'selected':''}>Weekly</option><option value="one-time" ${eq.repeat==='one-time'?'selected':''}>One-time</option></select><span class="label">Assigned to</span><select id="qassigned" class="select"><option value="Either" ${eq.assigned==='Either'?'selected':''}>Either player</option><option value="0" ${eq.assigned==='0'?'selected':''}>${S.players[0].name}</option><option value="1" ${eq.assigned==='1'?'selected':''}>${S.players[1].name}</option></select></div></div><div class="toolbar" style="margin-top:12px"><button class="btn" onclick="storeQuest(${E==='new'?"'new'":E})">Save Quest</button><button class="btn subtle" onclick="cancelQuest()">Cancel</button>${E!=='new'?`<button class="btn subtle delete" onclick="removeQuest(${E})">Delete</button>`:''}</div></div>`:''}${S.quests.map((q,i)=>{let buttons='';if(!q.done){let allow0=q.assigned==='Either'||q.assigned==='0',allow1=q.assigned==='Either'||q.assigned==='1';buttons=`<div class="who">${allow0?`<button onclick="complete(${i},0)">${S.players[0].name} did it</button>`:''}${allow1?`<button onclick="complete(${i},1)">${S.players[1].name} did it</button>`:''}</div>`}return `<div class="panel quest ${q.done?'done':''}"><div><h3>${q.t}</h3><p>${q.task}</p><div class="qmeta"><span class="pill">+${q.xp} XP</span><span class="pill">${q.repeat==='one-time'?'One-time':q.repeat[0].toUpperCase()+q.repeat.slice(1)}</span><span class="pill">${q.assigned==='Either'?'Either':S.players[Number(q.assigned)]?.name||'Either'}</span></div></div><div>${q.done?'✓ Complete':buttons}<div style="margin-top:7px;text-align:right"><button class="btn subtle" onclick="editQuest(${i})">Edit</button></div></div></div>`}).join('')}`}
if(S.tab==='Journey'){let st=CAM[S.ci],pct=Math.min(100,S.miles/st[3]*100),innPct=Math.min(100,(S.innMiles||0)/10*100);h=`<div class="panel"><div class="ey">${S.downed?'Recovery Journey':'Main Quest • Chapter '+(S.ci+1)}</div><h2>${S.downed?'Road to The Weary Wyvern Inn':'Road to '+st[0]}</h2>${S.downed?`<div class="reward"><h3>☠️ A party member has fallen</h3><p>Combat is locked until the party reaches the inn. Chores can still be completed and still award XP.</p><div class="bar"><i style="width:${innPct}%"></i></div><p><b>${(S.innMiles||0).toFixed(1)} / 10 miles to the inn</b></p><button class="btn" onclick="syncFitness()">↻ Sync Apple Health</button><p class="small">Inn progress counts only miles synced after the defeat.</p></div>`:`<div class="nodes">${CAM.map((x,i)=>`<div class="node ${i===S.ci?'now':''} ${S.defeated.includes(x[1])?'done':''}"><b>Chapter ${i+1}</b><div>${x[0]}</div><span class="small">${S.defeated.includes(x[1])?'✓ Complete':i===S.ci?'Current':'Locked'}</span></div>`).join('')}</div><p>Walk <b>${st[3]} miles</b> to reach the next boss. Walking never gives XP.</p><div class="bar"><i style="width:${pct}%"></i></div><p><b>${S.miles.toFixed(1)} / ${st[3]} miles</b></p><button class="btn" onclick="syncFitness()">↻ Sync Apple Health</button><p class="small">This week: ${Number(S.fitnessByPlayer?.vaelora||0).toFixed(1)} mi Vaelora + ${Number(S.fitnessByPlayer?.cellssara||0).toFixed(1)} mi Cellssara${S.fitnessUpdated?' • synced '+new Date(S.fitnessUpdated).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}):''}</p>${S.miles>=st[3]&&!S.boss?`<div class="reward"><h3>🔥 ${st[1]} — Level ${st[2]}</h3><p>You may fight now or keep leveling with chores. A major companion reward is hidden behind this victory.</p><button class="btn danger" onclick="startBattle('boss')">Challenge Boss</button></div>`:''}${S.boss?`<div class="reward"><h3>🏆 Major Victory</h3><p>🐾 <b>${st[4]}</b> has joined your companion roster.</p>${S.ci<CAM.length-1?`<button class="btn" onclick="next()">Begin Next Chapter</button>`:'<b>Campaign complete!</b>'}</div>`:''}`}</div><div class="panel"><h3>🎲 Random Encounter</h3><p>Complete <b>3 chores</b> to draw a new encounter from the road. Each encounter has its own enemy, story, stats, and combat trait. Attempting it uses the encounter whether you win or lose.</p><div class="bar"><i style="width:${Math.min(100,(S.choreCount||0)/3*100)}%"></i></div><p><b>${Math.min(S.choreCount||0,3)} / 3 chores completed</b></p>${S.downed?`<button class="btn" disabled>🔒 Reach the inn first</button>`:S.encounterReady?`<button class="btn" onclick="startBattle('random')">⚠️ Enter Random Encounter</button>`:`<button class="btn" disabled>🔒 Encounter Locked</button>`}${battleUI()}</div>`}
if(S.tab==='Companions')h=`<div class="row"><div><div class="ey">Household Allies</div><h2>Companions</h2></div><span class="small">One active each • boss rewards</span></div><div class="cards">${P.map(x=>S.un.includes(x[0])?`<div class="panel"><h3>🐾 ${x[0]}</h3><b>${x[1]}</b><p>${x[2]}</p><div class="who"><button onclick="S.players[0].comp='${x[0]}';save();render()">Equip to ${S.players[0].name}</button><button onclick="S.players[1].comp='${x[0]}';save();render()">Equip to ${S.players[1].name}</button></div></div>`:`<div class="panel lock"><h2>🔒</h2><h3>???</h3><p>An unknown household companion awaits a major victory.</p></div>`).join('')}</div>`;
if(S.tab==='Inventory')h=`<h2>Inventory & Spellbook</h2><div class="grid"><div>${S.players.map((p,i)=>`<div class="panel"><h3>${p.name}</h3><p>Weapon: <b>${p.w}</b><br>Armor: <b>${p.ar}</b><br>Spell: <b>${p.sp||'None'}</b></p></div>`).join('')}</div><div class="cards">${S.bag.map(n=>`<div class="panel"><h3>${n}</h3><p>${I[n]?.[0]||'item'} • power ${I[n]?.[1]||1}</p>${I[n]?`<div class="who"><button onclick="equip('${n}',0)">Equip: ${S.players[0].name}</button><button onclick="equip('${n}',1)">Equip: ${S.players[1].name}</button></div>`:''}</div>`).join('')}</div></div>`;view.innerHTML=h;updateSoundUI()}
render();syncFitness();</script></body></html>
