function battleAction(type){let b=S.battle;if(!b?.active)return;let living=S.players.map((p,i)=>p.hp>0?i:-1).filter(i=>i>=0);if(!living.length)return finishBattle(false);let i=living.includes(b.turn)?b.turn:living[0],p=S.players[i],e=b.enemy,base=Math.max(1,atk(p)-e.defense+Math.floor(Math.random()*5)),dmg=0;

}
function enemyTurn(){let b=S.battle,e=b.enemy,ids=S.players.map((p,i)=>p.hp>0?i:-1).filter(i=>i>=0);if(!ids.length)return;let i=ids[Math.floor(Math.random()*ids.length)],p=S.players[i],blocked=(p.comp==='Poe'&&Math.random()<.18)||(p.cl==='Paladin'&&Math.random()<.12);if(blocked){b.log.push(`🛡️ ${p.name} blocks ${e.name}'s attack.`);return}let armor=def(p),raw=Math.max(1,Math.round(e.attack+Math.random()*5-armor));if(e.trait==='Dirty Fighting'&&Math.random()<.25){raw=Math.max(raw,Math.round(e.attack*.8));b.log.push('🗡️ Dirty Fighting slips past part of the party’s defense.')}if(e.trait==='Pack Hunter'&&p.hp<max(p)*.55)raw=Math.round(raw*1.3);if(e.trait==='Maul'&&Math.random()<.18){raw=Math.round(raw*1.8);b.log.push('🐻 A brutal Maul crashes into the party!')}if(b.defending[i]){raw=Math.max(1,Math.round(raw*.45));b.defending[i]=false}if(p.cl==='Tank')raw=Math.max(1,Math.round(raw*.82));p.hp=Math.max(0,p.hp-raw);b.log.push(`💥 ${e.name} hits ${p.name} for ${raw}.`);if(e.trait==='Swarm'&&Math.random()<.22&&p.hp>0){let extra=Math.max(1,Math.round(raw*.4));p.hp=Math.max(0,p.hp-extra);b.log.push(`👥 The swarm lands another hit for ${extra}.`)}if(e.trait==='Dark Mend'&&Math.random()<.2&&e.hp>0){let heal=Math.min(9,e.maxHp-e.hp);e.hp+=heal;if(heal>0)b.log.push(`🕯️ Dark energy restores ${heal} HP to ${e.name}.`)}sfx('hit')}
function finishBattle(win){let b=S.battle,st=CAM[S.ci];b.active=false;b.win=win?1:0;if(win){if(b.kind==='boss'){S.boss=true;if(!S.defeated.includes(st[1]))S.defeated.push(st[1]);if(!S.un.includes(st[4]))S.un.push(st[4]);let loot=BOSS_LOOT[S.ci];b.item=loot;S.unclaimedLoot=loot;b.log.push(`🏆 ${st[1]} falls. ${st[4]} is unlocked!`);b.log.push(`💎 Boss loot: ${loot} (${item(loot).rarity}). Choose who keeps it.`);sfx('companion')}else{let candidates=S.players.filter(p=>p.hp>0),focus=candidates[Math.floor(Math.random()*candidates.length)]||S.players[0],it=rollLoot(focus.cl,lv(focus),S.players.some(p=>p.cl==='Rogue'));b.item=it;S.unclaimedLoot=it;b.log.push(`🎁 Victory! Found ${it} — ${item(it).rarity}. Choose who keeps it.`);sfx('victory');setTimeout(()=>sfx('loot'),260)}}else{b.log.push('☠️ The party is defeated and retreats.');sfx('defeat')}
  if(S.players.some(p=>p.hp<=0)){S.downed=true;S.innMiles=0;S.innStartTotal=S.fitnessAllTime||0;b.log.push('🏚️ A party member is down. The Weary Wyvern Inn is 1 mile away.')}save();render()
}
function walk(n){
  if(S.downed){S.innMiles=Math.min(1,(S.innMiles||0)+n);if(S.innMiles>=1){S.players.forEach(p=>p.hp=max(p));S.downed=false;S.innMiles=0;S.battle={win:1,item:'Full rest at The Weary Wyvern Inn',log:['🏚️ The party reaches the inn. Everyone is restored to full health.']};sfx('inn')}}
  else {let st=CAM[S.ci];S.miles=Math.min(st[3],S.miles+n)}
  save();render()
}
function next(){sfx('click');if(S.ci<CAM.length-1){S.ci++;S.miles=0;S.boss=false;S.battle=null;save();render()}}
function equip(n,i){let p=S.players[i],x=item(n);if(!p.inv.includes(n))return;if(!canEquip(p,n)){alert(`${n} requires the ${x.req} class.`);return}sfx('loot');if(x.type==='weapon')p.w=n;if(x.type==='armor')p.ar=n;if(x.type==='spell')p.sp=n;hp();save();render()}
function battleUI(){let b=S.battle;if(!b)return '';if(b.active){let p=S.players[b.turn],e=b.enemy,pct=Math.max(0,e.hp/e.maxHp*100);return `<div class=\"battlebox\"><div class=\"ey\">Turn-Based Battle • Round ${b.round}</div><h3 class=\"encountername\">${e.name} • Lv ${e.level}</h3><p>${e.flavor||''}</p><div class=\"encountertrait\"><b>⚠️ ${e.trait||'Unknown Trait'}</b> — ${e.traitDesc||'Watch your footing.'}</div><div class=\"hp enemyhp\"><i style=\"width:${pct}%\"></i></div><p><b>${e.hp} / ${e.maxHp} enemy HP</b></p><div class=\"combatants\">${S.players.map((x,i)=>`<div class=\"combatant\"><b>${x.name}</b> • ${x.cl} Lv ${lv(x)}<div class=\"hp\"><i style=\"width:${Math.max(0,x.hp/max(x)*100)}%\"></i></div><span class=\"small\">${x.hp}/${max(x)} HP ${i===b.turn&&x.hp>0?'• YOUR TURN':''}</span></div>`).join('')}</div><p><b>${p?.name||'Party'}'s turn</b></p><div class=\"actions\"><button class=\"btn\" onclick=\"battleAction('attack')\">⚔️ Attack</button><button class=\"btn subtle\" onclick=\"battleAction('defend')\">🛡️ Defend</button><button class=\"btn\" onclick=\"battleAction('class')\">✨ ${p?C[p.cl].p:'Class Ability'}</button><button class=\"btn subtle\" onclick=\"battleAction('spell')\">🔮 Spell</button><button class=\"btn subtle\" onclick=\"battleAction('companion')\" ${p?.comp?'':'disabled'}>🐾 Companion</button></div><div class=\"log\">${b.log.slice(-12).reverse().map(x=>`<div>${x}</div>`).join('')}</div></div>`}return `<div class=\"reward\">${b.win&&b.kind==='boss'&&S.lastUnlock?`<div class=\"unlock\"><div class=\"ey\">Major Victory</div><h2>🐾 COMPANION UNLOCKED</h2><h2>${S.lastUnlock}</h2><p>${(P.find(x=>x[0]===S.lastUnlock)||['','','A new ally joins the party.'])[2]}</p><div class=\"claimrow\"><button class=\"btn\" onclick=\"S.players[0].comp='${S.lastUnlock}';S.lastUnlock=null;save();render()\">Equip to ${S.players[0].name}</button><button class=\"btn\" onclick=\"S.players[1].comp='${S.lastUnlock}';S.lastUnlock=null;save();render()\">Equip to ${S.players[1].name}</button></div></div>`:''}<b>${b.win?'Victory!'+(b.item?' Reward: '+b.item:''):'Defeat — your remaining HP carries forward.'}</b>${b.win&&S.unclaimedLoot?`<div class=\"claimrow\"><button class=\"btn\" onclick=\"claimLoot(0)\">Give to ${S.players[0].name}</button><button class=\"btn\" onclick=\"claimLoot(1)\">Give to ${S.players[1].name}</button></div>`:b.claimedBy?`<p class=\"small\">Claimed by ${b.claimedBy}</p>`:''}<div class=\"log\">${b.log.slice(-16).reverse().map(x=>`<div>${x}</div>`).join('')}</div></div>`}
function render(){nav();let h=rewardUI();if(S.tab==='Tavern')h+=`<div class="panel"><div class="ey">Tonight at the Hearth</div><h2>Your next chapter awaits.</h2><p>Complete real household chores for XP. Walking moves the party toward the next boss. Classes, equipment, spells and earned companions affect combat.</p></div><div class="grid">${card(S.players[0],0)}${card(S.players[1],1)}</div>`;
if(S.tab==='Quest Board'){let E=S.editing,eq=E==='new'?{t:'',task:'',xp:10,repeat:'daily',assigned:'Either'}:(typeof E==='number'?S.quests[E]:null);h+=`<div class="row"><div><div class="ey">Pinned beside the hearth</div><h2>Quest Board</h2></div><div class="toolbar"><span class="small">Encounter progress: ${Math.min(S.choreCount||0,3)} / 3 chores • Together splits XP 50/50</span><button class="btn" onclick="addQuest()">+ Add Quest</button></div></div>${eq?`<div class="editor"><div class="ey">${E==='new'?'Create a household quest':'Edit household quest'}</div><div class="editorgrid"><div><span class="label">Fantasy title</span><input id="qt" value="${eq.t.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}"><span class="label">Actual chore</span><textarea id="qtask">${eq.task}</textarea></div><div><span class="label">XP reward</span><input id="qxp" type="number" min="1" value="${eq.xp}"><span class="label">Repeat</span><select id="qrepeat" class="select"><option value="daily" ${eq.repeat==='daily'?'selected':''}>Daily</option><option value="weekly" ${eq.repeat==='weekly'?'selected':''}>Weekly</option><option value="one-time" ${eq.repeat==='one-time'?'selected':''}>One-time</option></select><span class="label">Assigned to</span><select id="qassigned" class="select"><option value="Either" ${eq.assigned==='Either'?'selected':''}>Either player</option><option value="0" ${eq.assigned==='0'?'selected':''}>${S.players[0].name}</option><option value="1" ${eq.assigned==='1'?'selected':''}>${S.players[1].name}</option></select></div></div><div class="toolbar" style="margin-top:12px"><button class="btn" onclick="storeQuest(${E==='new'?"'new'":E})">Save Quest</button><button class="btn subtle" onclick="cancelQuest()">Cancel</button>${E!=='new'?`<button class="btn subtle delete" onclick="removeQuest(${E})">Delete</button>`:''}</div></div>`:''}${S.quests.map((q,i)=>{let buttons='';if(!q.done){let allow0=q.assigned==='Either'||q.assigned==='0',allow1=q.assigned==='Either'||q.assigned==='1';buttons=`<div class="who">${allow0?`<button onclick="complete(${i},0)">${S.players[0].name} did it</button>`:''}${allow1?`<button onclick="complete(${i},1)">${S.players[1].name} did it</button>`:''}${q.assigned==='Either'?`<button onclick="completeTogether(${i})">🤝 We did it together</button>`:''}</div>`}return `<div class="panel quest ${q.done?'done':''}"><div><h3>${q.t}</h3><p>${q.task}</p><div class="qmeta"><span class="pill">+${q.xp} XP</span><span class="pill">${q.repeat==='one-time'?'One-time':q.repeat[0].toUpperCase()+q.repeat.slice(1)}</span><span class="pill">${q.assigned==='Either'?'Either':S.players[Number(q.assigned)]?.name||'Either'}</span></div></div><div>${q.done?'✓ Complete':buttons}<div style="margin-top:7px;text-align:right"><button class="btn subtle" onclick="editQuest(${i})">Edit</button></div></div></div>`}).join('')}`}
if(S.tab==='Journey'){let st=CAM[S.ci],pct=Math.min(100,S.miles/st[3]*100),innPct=Math.min(100,(S.innMiles||0)/1*100);h+=`<div class="panel"><div class="ey">${S.downed?'Recovery Journey':'Main Quest • Chapter '+(S.ci+1)}</div><h2>${S.downed?'Road to The Weary Wyvern Inn':'Road to '+st[0]}</h2>${S.downed?`<div class="reward"><h3>☠️ A party member has fallen</h3><p>Combat is locked until the party reaches the inn. Chores can still be completed and still award XP.</p><div class="bar"><i style="width:${innPct}%"></i></div><p><b>${(S.innMiles||0).toFixed(1)} / 1 mile to the inn</b></p><button class="btn" onclick="syncFitness()">↻ Sync Apple Health</button><p class="small">Inn progress counts only miles synced after the defeat.</p></div>`:`<div class="nodes">${CAM.map((x,i)=>`<div class="node ${i===S.ci?'now':''} ${S.defeated.includes(x[1])?'done':''}"><b>Chapter ${i+1}</b><div>${x[0]}</div><span class="small">${S.defeated.includes(x[1])?'✓ Complete':i===S.ci?'Current':'Locked'}</span></div>`).join('')}</div><p>Walk <b>${st[3]} miles</b> to reach the next boss. Walking never gives XP.</p><div class="bar"><i style="width:${pct}%"></i></div><p><b>${S.miles.toFixed(1)} / ${st[3]} miles</b></p><button class="btn" onclick="syncFitness()">↻ Sync Apple Health</button><p class="small">This week: ${Number(S.fitnessByPlayer?.vaelora||0).toFixed(1)} mi Vaelora + ${Number(S.fitnessByPlayer?.cellssara||0).toFixed(1)} mi Cellssara${S.fitnessUpdated?' • synced '+new Date(S.fitnessUpdated).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}):''}</p>${S.miles>=st[3]&&!S.boss?`<div class="reward"><h3>🔥 ${st[1]} — Level ${st[2]}</h3><p>You may fight now or keep leveling with chores. A major companion reward is hidden behind this victory.</p><button class="btn danger" onclick="startBattle('boss')">Challenge Boss</button></div>`:''}${S.boss?`<div class="reward"><h3>🏆 Major Victory</h3><p>🐾 <b>${st[4]}</b> has joined your companion roster.</p>${S.ci<CAM.length-1?`<button class="btn" onclick="next()">Begin Next Chapter</button>`:'<b>Campaign complete!</b>'}</div>`:''}`}</div><div class="panel"><h3>🎲 Random Encounter</h3><p>Complete <b>3 chores</b> to draw a new encounter from the road. Each encounter has its own enemy, story, stats, and combat trait. Attempting it uses the encounter whether you win or lose.</p><div class="bar"><i style="width:${Math.min(100,(S.choreCount||0)/3*100)}%"></i></div><p><b>${Math.min(S.choreCount||0,3)} / 3 chores completed</b></p>${S.downed?`<button class="btn" disabled>🔒 Reach the inn first</button>`:S.encounterReady?`<button class="btn" onclick="startBattle('random')">⚠️ Enter Random Encounter</button>`:`<button class="btn" disabled>🔒 Encounter Locked</button>`}${battleUI()}</div>`}
if(S.tab==='Companions')h+=`<div class="row"><div><div class="ey">Household Allies</div><h2>Companions</h2></div><span class="small">One active each • boss rewards</span></div><div class="cards">${P.map(x=>S.un.includes(x[0])?`<div class="panel"><h3>🐾 ${x[0]}</h3><b>${x[1]}</b><p>${x[2]}</p><div class="who"><button onclick="S.players[0].comp='${x[0]}';save();render()">Equip to ${S.players[0].name}</button><button onclick="S.players[1].comp='${x[0]}';save();render()">Equip to ${S.players[1].name}</button></div></div>`:`<div class="panel lock"><h2>🔒</h2><h3>???</h3><p>An unknown household companion awaits a major victory.</p></div>`).join('')}</div>`;
if(S.tab==='Inventory')h+=`<div class="row"><div><div class="ey">Personal Gear</div><h2>Inventory & Loadouts</h2></div><span class="small">Gear stays with the player who claims it</span></div><div class="grid">${S.players.map((p,i)=>`<div><div class="panel"><h3>${p.name} • ${p.cl} Lv ${lv(p)}</h3><p><span class="slot">Weapon</span><br><b>${p.w}</b><br><span class="slot">Armor</span><br><b>${p.ar}</b><br><span class="slot">Spell</span><br><b>${p.sp||'None'}</b></p><div class="statgrid"><div class="stat"><b>${atk(p)}</b><small>Attack</small></div><div class="stat"><b>${def(p)}</b><small>Defense</small></div><div class="stat"><b>+${gearStat(p,'heal')}</b><small>Heal Gear</small></div></div></div>${(p.inv||[]).map(n=>{let x=item(n),eq=p.w===n||p.ar===n||p.sp===n,locked=!canEquip(p,n);return `<div class="panel gearcard ${eq?'equipped':''}"><div class="rarity-${x.rarity}"><b>${x.rarity||'Common'}</b></div><h3>${n}</h3><div class="slot">${x.type||'item'}${x.req?' • '+x.req+' only':''}</div><p>${x.desc||''}</p><div class="itemstats">${itemText(n)}</div>${eq?'<span class="pill">✓ Equipped</span>':`<button class="btn subtle" ${locked?'disabled':''} onclick="equip('${n.replace(/'/g,"\'")}',${i})">${locked?'Switch to '+x.req:'Equip'}</button>`}</div>`}).join('')}</div>`).join('')}</div>`;if(S.tab==='Achievements')h+=achievementUI();view.innerHTML=h;updateSoundUI()}
if(sharedCreds()){loadShared(false);setInterval(()=>{if(sharedReady&&!sharedBusy)loadShared(false)},12000)}
render();syncFitness();</script></body></html>
