<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tavern Quest</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#4a2c16,transparent 35%),linear-gradient(#1b110a,#0d0906);color:#f1e5c5;font-family:Georgia,serif;min-height:100vh}body:before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.12;background-image:repeating-linear-gradient(90deg,transparent 0 72px,#000 73px 74px),repeating-linear-gradient(0deg,transparent 0 38px,#000 39px 40px)}main{max-width:1080px;margin:auto;padding:24px 16px 60px;position:relative}header{display:flex;justify-content:space-between;align-items:center}.eyebrow{text-transform:uppercase;letter-spacing:.18em;font-size:11px;color:#c79b58;font-weight:bold}h1{font-size:42px;margin:4px 0;color:#f6d58a;text-shadow:0 2px #000}h2{font-size:28px;margin:6px 0}h3{margin:0 0 6px}p{color:#d5c6a8;line-height:1.45}.crest{font-size:44px}.panel{background:linear-gradient(145deg,#2a1a10ee,#1a110bee);border:1px solid #795235;border-radius:15px;box-shadow:0 12px 30px #0006,inset 0 1px #ffffff0d;padding:18px}nav{position:sticky;top:0;z-index:5;display:flex;gap:7px;overflow:auto;padding:10px;background:#160f0add;border:1px solid #6f4b2d;border-radius:14px;backdrop-filter:blur(8px);margin:16px 0}button{cursor:pointer;font-family:inherit}nav button{background:transparent;color:#d9c8a9;border:0;padding:10px 13px;border-radius:9px;white-space:nowrap}nav button.active{background:#6f431f;color:#fff2ce}.action{background:linear-gradient(#b37a32,#7b4a1f);border:1px solid #e1b96f;color:#fff6df;border-radius:9px;padding:11px 15px;font-weight:bold;box-shadow:0 3px 0 #4b2a12}.hero{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:16px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.player-top{display:flex;justify-content:space-between;gap:10px;align-items:center}.player input,.player select{width:100%;background:#120c08;color:#f7e8c7;border:1px solid #684529;border-radius:8px;padding:10px;font-family:inherit}.player input{font-size:24px;font-weight:bold;margin-top:4px}.player label{display:block;margin:13px 0 5px;color:#caa66b;font-size:12px;text-transform:uppercase;letter-spacing:.12em}.level{font-size:20px;color:#f6d58a}.xp{height:9px;background:#0c0805;border-radius:99px;overflow:hidden;margin:15px 0 5px}.xp div{height:100%;background:linear-gradient(90deg,#835cff,#c598ff)}.tiny{font-size:11px;color:#a99779}.perk{margin-top:10px;background:#120c08;border:1px solid #4f3824;border-radius:10px;padding:10px}.perk span{display:block;color:#bfaf93;font-size:13px;margin-top:4px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.stat{background:#120c08;border:1px solid #4f3824;border-radius:9px;padding:9px;text-align:center}.stat b{display:block;color:#f5d592;font-size:17px}.stat small{color:#9e8d73}.quest-list{display:grid;gap:11px}.quest{display:flex;justify-content:space-between;gap:15px;align-items:center}.quest h3{color:#f1d390}.quest p{margin:5px 0}.quest .reward{font-size:12px;color:#c3a269}.quest.done{opacity:.55}.section-title{display:flex;align-items:end;justify-content:space-between;gap:15px;margin:12px 2px}.section-title span{font-size:13px;color:#b7a787}.travel{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin:18px 0}.bar{height:14px;background:#100b08;border-radius:99px;overflow:hidden;border:1px solid #5b3b25}.bar div{height:100%;background:linear-gradient(90deg,#58743b,#c7a64a)}.boss{margin-top:18px;padding:15px;border:1px solid #b54c2e;background:#39180f;border-radius:12px}.result{margin-top:12px;padding:12px;border-radius:9px}.win{background:#1f3b24;border:1px solid #4d8555}.lose{background:#3a2621;border:1px solid #765044}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:13px}.pet{text-align:center}.pet .icon{font-size:34px}.loot{display:flex;gap:12px}.who{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.who button{padding:8px 10px;background:#21150d;color:#ead8b4;border:1px solid #654329;border-radius:8px}.locked{filter:saturate(.45);opacity:.74}.lockmark{font-size:30px;margin-bottom:7px}.unlocked{border-color:#9f7843}.notice{margin:14px 0;padding:12px;border:1px solid #a97a39;background:#33200f;border-radius:10px;color:#f1d698}.save-note{font-size:11px;color:#91826c}.badge{display:inline-block;padding:4px 7px;border-radius:99px;background:#3a2515;border:1px solid #76502f;color:#d9be8f;font-size:11px}.reward-card{margin-top:12px;padding:14px;border:1px solid #d4a24f;background:linear-gradient(145deg,#443018,#27190e);border-radius:11px}.danger{background:linear-gradient(#9d4b2d,#62301e);border-color:#d1835b}.muted-btn{background:#21150d!important;border-color:#604229!important;box-shadow:none!important}.battle-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.combatant{background:#120c08;border:1px solid #5d422a;border-radius:12px;padding:12px}.hp{height:10px;background:#080605;border-radius:99px;overflow:hidden;margin:7px 0}.hp div{height:100%;background:linear-gradient(90deg,#6e1f1f,#b8503b)}.battle-log{margin-top:12px;max-height:220px;overflow:auto;background:#0f0a07;border:1px solid #4c3421;border-radius:10px;padding:10px}.battle-log div{padding:5px 0;border-bottom:1px solid #ffffff0b;color:#cdbb9d;font-size:13px}.reward-choice{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:12px}.choice{background:#160f0a;border:1px solid #75502d;border-radius:10px;padding:12px}.choice button{width:100%;margin-top:8px}.item-equip{margin-top:7px}.item-equip button{font-size:12px;padding:6px 8px;background:#24170f;color:#ead6b2;border:1px solid #60422b;border-radius:7px}.equipped{border-color:#c89b4e!important;box-shadow:0 0 0 1px #c89b4e33}.pill{display:inline-block;font-size:10px;padding:3px 6px;border-radius:99px;background:#533719;color:#f0d4a2;margin-left:5px}footer{text-align:center;color:#766a59;font-size:12px;padding-top:30px}@media(max-width:720px){.grid2,.battle-grid{grid-template-columns:1fr}.hero,.quest,.section-title{align-items:flex-start;flex-direction:column}.hero .action,.quest .action{width:100%}.crest{display:none}h1{font-size:34px}.cards{grid-template-columns:1fr 1fr}}@media(max-width:460px){.cards{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}}
</style></head><body><main><header><div><div class="eyebrow">Two-Player Household RPG</div><h1>🍺 Tavern Quest</h1><p>Chores make you stronger. Walking carries you to the next danger.</p></div><div class="crest">⚔️</div></header><nav id="nav"></nav><div id="view"></div><footer>Combat build • Saves locally • Apple Fitness integration comes after the core game loop</footer></main><script>
const classes={Tank:{icon:'🛡️',perk:'Bulwark',desc:'+30% max health and 15% damage reduction.',hp:1.3,atk:1,heal:1,loot:1,spell:1,comp:1},Healer:{icon:'✨',perk:'Second Wind',desc:'Recover 30% more health after battles.',hp:1,atk:.9,heal:1.3,loot:1,spell:1.1,comp:1},Rogue:{icon:'🗡️',perk:'Lucky Find',desc:'Higher crit and rare-loot chance.',hp:.95,atk:1.12,heal:1,loot:1.35,spell:.9,comp:1},Wizard:{icon:'🔮',perk:'Arcane Focus',desc:'Spells deal 30% more damage.',hp:.85,atk:.9,heal:1,loot:1,spell:1.3,comp:1},Ranger:{icon:'🏹',perk:'Pack Bond',desc:'Active companion bonuses are 40% stronger.',hp:1,atk:1.05,heal:1,loot:1,spell:1,comp:1.4},Paladin:{icon:'⚔️',perk:'Radiant Guard',desc:'Balanced defense with a chance to block damage.',hp:1.15,atk:1.05,heal:1.1,loot:1,spell:1,comp:1}};
const companions=[{name:'Poe',title:'Loyal Guardian',bonus:'Chance to block the first enemy hit.',type:'block'},{name:'Hobie',title:'Tracker of Trails',bonus:'Improves loot quality after victories.',type:'loot'},{name:'Odin',title:'Steadfast Sentinel',bonus:'Raises party defense.',type:'def'},{name:'Ted',title:'Ironheart',bonus:'Adds power to physical attacks.',type:'atk'},{name:'Cloud',title:'Arcane Familiar',bonus:'Boosts spell power.',type:'spell'},{name:'Dozer',title:'The Fearless',bonus:'Chance to strike twice.',type:'double'},{name:'Trousers',title:'Trail Trickster',bonus:'Improves dodge chance.',type:'dodge'},{name:'Bobby',title:'Quickpaw',bonus:'Adds initiative in encounters.',type:'init'},{name:'Boogie',title:'Lucky Paw',bonus:'Small chance for bonus loot.',type:'loot'},{name:'Edgar',title:'Tiny Terror',bonus:'Chance to interrupt an enemy attack.',type:'interrupt'},{name:'Cheese',title:'Golden Nose',bonus:'Improves treasure discovery.',type:'loot'},{name:'Barriss',title:'Young Vanguard',bonus:'Grows stronger with your party.',type:'scale'}];
const items=[{name:'Rusty Longsword',type:'weapon',power:1,icon:'🗡️'},{name:'Iron Shortsword',type:'weapon',power:2,icon:'⚔️'},{name:'Silvered Dagger',type:'weapon',power:3,icon:'🗡️'},{name:'Oak Wand',type:'weapon',power:2,icon:'🪄'},{name:'Traveler’s Cloak',type:'armor',power:1,icon:'🧥'},{name:'Leather Bracers',type:'armor',power:2,icon:'🛡️'},{name:'Minor Healing Potion',type:'consumable',power:8,icon:'🧪'},{name:'Scroll of Shielding',type:'spell',power:2,icon:'📜'},{name:'Magic Missile',type:'spell',power:3,icon:'✨'},{name:'Cure Wounds',type:'spell',power:3,icon:'💚'},{name:'Burning Hands',type:'spell',power:4,icon:'🔥'}];
const levelChoices=[['Iron Shortsword','Magic Missile'],['Leather Bracers','Cure Wounds'],['Silvered Dagger','Burning Hands'],['Oak Wand','Scroll of Shielding']];
const defaults={tab:'Tavern',players:[{name:'Vaelora',klass:'Ranger',comp:null,xp:40,hp:null,weapon:'Rusty Longsword',armor:'Traveler’s Cloak',spell:null,claimedLevel:1},{name:'Cellssara',klass:'Tank',comp:null,xp:35,hp:null,weapon:'Rusty Longsword',armor:'Traveler’s Cloak',spell:null,claimedLevel:1}],miles:18.4,quests:[{title:'Replenish the Companions’ Wells',task:'Fill the dogs’ water bowls.',xp:10,done:false},{title:'Banish the Refuse',task:'Take out the kitchen trash and replace the bag.',xp:10,done:false},{title:'Restore the Great Hall',task:'Load the dishwasher and wipe the kitchen counters.',xp:15,done:false},{title:'Tend the Kennels',task:'Pick up the backyard dog waste.',xp:20,done:false}],bag:['Traveler’s Cloak','Rusty Longsword'],unlocked:[],battle:null,bossDefeated:false,bossReward:null,notice:null};
function clone(x){return JSON.parse(JSON.stringify(x))}function load(){try{let x=JSON.parse(localStorage.getItem('tavernQuestSave'));if(!x)return clone(defaults);let s={...clone(defaults),...x};s.players=s.players.map((p,i)=>({...clone(defaults.players[i]),...p}));return s}catch(e){return clone(defaults)}}let state=load();function save(){localStorage.setItem('tavernQuestSave',JSON.stringify(state))}
const tabs=['Tavern','Quest Board','Journey','Companions','Inventory'];function nav(){document.getElementById('nav').innerHTML=tabs.map(t=>`<button class="${state.tab===t?'active':''}" onclick="state.tab='${t}';save();render()">${t}</button>`).join('')}
function level(p){return Math.floor(p.xp/100)+1}function item(n){return items.find(i=>i.name===n)||{power:0,type:'none',icon:'•'}}function compObj(p){return p.comp?companions.find(c=>c.name===p.comp):null}function maxHP(p){return Math.round((28+level(p)*6)*classes[p.klass].hp)}function atk(p){let v=(4+level(p)*1.6+item(p.weapon).power*1.8)*classes[p.klass].atk;if(p.spell)v+=item(p.spell).power*classes[p.klass].spell*.9;let c=compObj(p);if(c&&c.type==='atk')v+=2*classes[p.klass].comp;if(c&&c.type==='scale')v+=level(p)*.6*classes[p.klass].comp;return Math.round(v*10)/10}function def(p){let v=1+item(p.armor).power;if(p.klass==='Tank')v+=2;if(p.klass==='Paladin')v+=1;let c=compObj(p);if(c&&c.type==='def')v+=2*classes[p.klass].comp;return Math.round(v*10)/10}
function ensureHP(){state.players.forEach(p=>{let m=maxHP(p);if(p.hp==null||p.hp>m)p.hp=m})}
function pendingReward(p){return level(p)>p.claimedLevel}function rewardOptions(p){let idx=(p.claimedLevel-1)%levelChoices.length;return levelChoices[idx]}
function claimReward(pi,name){if(!pendingReward(state.players[pi]))return;if(!state.bag.includes(name))state.bag.push(name);state.players[pi].claimedLevel++;state.notice=`${state.players[pi].name} chose ${name} as a level reward.`;save();render()}
function pcard(p,i){let cl=classes[p.klass],lv=level(p),prog=p.xp%100,owned=companions.filter(c=>state.unlocked.includes(c.name)),ac=compObj(p);return `<div class="panel player"><div class="player-top"><div><div class="eyebrow">Adventurer</div><input value="${p.name}" onchange="state.players[${i}].name=this.value;save()"></div><div class="level">Lv. ${lv}</div></div><div class="xp"><div style="width:${prog}%"></div></div><div class="tiny">${prog} / 100 XP to next level</div><label>Class</label><select onchange="state.players[${i}].klass=this.value;state.players[${i}].hp=null;ensureHP();save();render()">${Object.keys(classes).map(c=>`<option ${c===p.klass?'selected':''}>${c}</option>`).join('')}</select><div class="perk"><b>${cl.icon} ${cl.perk}</b><span>${cl.desc}</span></div><div class="stats"><div class="stat"><b>${p.hp}/${maxHP(p)}</b><small>HP</small></div><div class="stat"><b>${atk(p)}</b><small>Attack</small></div><div class="stat"><b>${def(p)}</b><small>Defense</small></div></div><label>Active Companion</label>${owned.length?`<select onchange="state.players[${i}].comp=this.value||null;save();render()"><option value="">None</option>${owned.map(c=>`<option ${c.name===p.comp?'selected':''}>${c.name}</option>`).join('')}</select>${ac?`<div class="tiny" style="margin-top:8px">🐾 ${ac.title}: ${ac.bonus}</div>`:''}`:`<div class="perk"><b>🔒 No companion earned yet</b><span>Companions are major rewards from boss victories.</span></div>`}${pendingReward(p)?`<div class="reward-card"><div class="eyebrow">Level-up reward</div><h3>Choose one</h3><div class="reward-choice">${rewardOptions(p).map(n=>`<div class="choice"><b>${item(n).icon} ${n}</b><p>${item(n).type} • power ${item(n).power}</p><button class="action" onclick="claimReward(${i},'${n.replaceAll("'","\\'")}')">Choose</button></div>`).join('')}</div></div>`:''}</div>`}
function complete(i,who){let q=state.quests[i];if(q.done)return;q.done=true;state.players[who].xp+=q.xp;state.notice=`${state.players[who].name} earned +${q.xp} XP for “${q.task}”`;ensureHP();save();render()}
function randomLoot(p){let pool=['Iron Shortsword','Oak Wand','Minor Healing Potion','Leather Bracers','Silvered Dagger','Scroll of Shielding'];let bonus=classes[p.klass].loot;let c=compObj(p);if(c&&c.type==='loot')bonus+=.35*classes[p.klass].comp;if(Math.random()<.18*bonus)pool.push('Magic Missile','Cure Wounds','Burning Hands');return pool[Math.floor(Math.random()*pool.length)]}
function simulate(kind='random'){ensureHP();let enemy=kind==='boss'?{name:'The Ashen Warden',hp:78,atk:12,def:3,level:5}:{name:['Cellar Goblins','Mire Wolves','Roadside Bandits'][Math.floor(Math.random()*3)],hp:38,atk:8,def:1.5,level:3};let ph=state.players.map(p=>p.hp),eh=enemy.hp,log=[],round=1,first=true;while(eh>0&&ph.some(h=>h>0)&&round<=12){state.players.forEach((p,i)=>{if(ph[i]<=0||eh<=0)return;let c=compObj(p);let dmg=Math.max(1,Math.round(atk(p)-enemy.def+Math.random()*5));if(p.klass==='Rogue'&&Math.random()<.22){dmg*=2;log.push(`🗡️ ${p.name} lands a critical hit!`)}if(c&&c.type==='double'&&Math.random()<.16*classes[p.klass].comp){dmg+=Math.round(dmg*.7);log.push(`🐾 ${c.name} helps ${p.name} strike again!`)}if(c&&c.type==='spell'&&p.spell)dmg+=Math.round(2*classes[p.klass].comp);eh-=dmg;log.push(`${p.name} deals ${dmg} damage to ${enemy.name}.`)});if(eh<=0)break;let targets=ph.map((h,i)=>h>0?i:null).filter(x=>x!==null);let ti=targets[Math.floor(Math.random()*targets.length)],p=state.players[ti],c=compObj(p),blocked=false;if(first&&c&&c.type==='block'&&Math.random()<.45*classes[p.klass].comp){blocked=true;log.push(`🐾 ${c.name} blocks the opening attack!`)}if(c&&c.type==='interrupt'&&Math.random()<.15*classes[p.klass].comp){blocked=true;log.push(`🐾 ${c.name} interrupts ${enemy.name}!`)}if(c&&c.type==='dodge'&&Math.random()<.15*classes[p.klass].comp){blocked=true;log.push(`🐾 ${c.name} helps ${p.name} dodge!`)}if(p.klass==='Paladin'&&Math.random()<.15){blocked=true;log.push(`⚔️ ${p.name} blocks with Radiant Guard!`)}if(!blocked){let raw=Math.max(1,enemy.atk+Math.random()*5-def(p));if(p.klass==='Tank')raw*=.85;let dmg=Math.round(raw);ph[ti]-=dmg;log.push(`${enemy.name} hits ${p.name} for ${dmg}.`)}first=false;round++}
let win=eh<=0;if(win){state.players.forEach((p,i)=>{let heal=Math.round(maxHP(p)*.18*classes[p.klass].heal);p.hp=Math.min(maxHP(p),Math.max(1,ph[i])+heal)});if(kind==='boss'){state.bossDefeated=true;let locked=companions.filter(c=>!state.unlocked.includes(c.name));let reward=locked.length?locked[Math.floor(Math.random()*locked.length)]:null;if(reward){state.unlocked.push(reward.name);state.bossReward=reward.name;state.battle={win:true,boss:true,item:reward.name,enemy:enemy.name,log}}else{let lo=randomLoot(state.players[0]);if(!state.bag.includes(lo))state.bag.push(lo);state.battle={win:true,boss:true,item:lo,enemy:enemy.name,log}}}else{let winner=state.players[Math.random()<.5?0:1],lo=randomLoot(winner);if(!state.bag.includes(lo)||item(lo).type==='consumable')state.bag.push(lo);state.battle={win:true,boss:false,item:lo,enemy:enemy.name,log}}}else{state.players.forEach((p,i)=>p.hp=Math.max(1,Math.round(maxHP(p)*.55)));state.battle={win:false,boss:kind==='boss',enemy:enemy.name,log};}
save();render()}
function equipComp(name,pi){if(state.unlocked.includes(name)){state.players[pi].comp=name;save();render()}}function equipItem(name,pi){let it=item(name);if(it.type==='weapon')state.players[pi].weapon=name;if(it.type==='armor')state.players[pi].armor=name;if(it.type==='spell')state.players[pi].spell=name;save();render()}
function resetDemo(){if(confirm('Reset this prototype save?')){localStorage.removeItem('tavernQuestSave');state=clone(defaults);ensureHP();render()}}
function render(){ensureHP();nav();let h='';if(state.tab==='Tavern')h=`<section>${state.notice?`<div class="notice">✨ ${state.notice}</div>`:''}<div class="hero panel"><div><div class="eyebrow">Tonight at the Hearth</div><h2>The road to Blackthorn Keep is open.</h2><p>Complete household quests for XP. Walking moves the party through the world. Your class, gear, spells and companion now affect combat.</p><div class="save-note">Progress saves on this device.</div></div><button class="action" onclick="state.tab='Quest Board';save();render()">View Quest Board</button></div><div class="grid2">${pcard(state.players[0],0)}${pcard(state.players[1],1)}</div></section>`;
if(state.tab==='Quest Board')h=`<section><div class="section-title"><div><div class="eyebrow">Pinned beside the hearth</div><h2>Quest Board</h2></div><span>Choose who actually completed each chore</span></div><div class="quest-list">${state.quests.map((q,i)=>`<div class="quest panel ${q.done?'done':''}"><div><h3>${q.title}</h3><p>${q.task}</p><div class="reward">Reward: +${q.xp} XP</div></div>${q.done?`<span class="badge">✓ Complete</span>`:`<div class="who"><button onclick="complete(${i},0)">${state.players[0].name} did it</button><button onclick="complete(${i},1)">${state.players[1].name} did it</button></div>`}</div>`).join('')}</div></section>`;
if(state.tab==='Journey')h=`<section><div class="panel"><div class="section-title"><div><div class="eyebrow">Main Quest</div><h2>Road to Blackthorn Keep</h2></div><b>Boss Lv. 5</b></div><p>Party walking goal: 25 miles this week. Walking gets you there; chores make you stronger.</p><div class="travel"><div class="bar"><div style="width:${Math.min(100,state.miles/25*100)}%"></div></div><b>${state.miles.toFixed(1)} / 25 mi</b></div><button class="action muted-btn" onclick="state.miles=Math.min(25,state.miles+1.2);save();render()">Demo: Add Walking</button>${state.miles>=25&&!state.bossDefeated?`<div class="boss"><h3>🔥 Boss Discovered: The Ashen Warden</h3><p>Recommended party level: 4–5. You can challenge now or keep leveling through chores.</p><button class="action danger" onclick="simulate('boss')">Challenge Boss</button></div>`:''}${state.bossDefeated?`<div class="reward-card"><div class="eyebrow">Major Victory</div><h3>🏆 The Ashen Warden has fallen</h3>${state.bossReward?`<p>🐾 <b>${state.bossReward}</b> has joined your companion roster.</p>`:`<p>The boss yielded treasure.</p>`}</div>`:''}</div><div class="panel" style="margin-top:16px"><h3>🎲 Random Encounter</h3><p>Winning can drop equipment or spells. Losing costs nothing.</p><button class="action" onclick="simulate('random')">Roll the Encounter</button>${state.battle?`<div class="result ${state.battle.win?'win':'lose'}"><b>${state.battle.win?'Victory!':'Defeat — nothing is lost.'}</b>${state.battle.win?`<div>Reward: ${state.battle.item}</div>`:''}<div class="battle-log">${state.battle.log.map(x=>`<div>${x}</div>`).join('')}</div></div>`:''}</div></section>`;
if(state.tab==='Companions')h=`<section><div class="section-title"><div><div class="eyebrow">Household Allies</div><h2>Companions</h2></div><span>Earned through major victories • one active each</span></div><div class="cards">${companions.map(c=>{let owned=state.unlocked.includes(c.name);return owned?`<div class="panel pet unlocked"><div class="icon">🐾</div><h3>${c.name}</h3><b>${c.title}</b><p>${c.bonus}</p><div class="who"><button onclick="equipComp('${c.name}',0)">Equip to ${state.players[0].name}</button><button onclick="equipComp('${c.name}',1)">Equip to ${state.players[1].name}</button></div></div>`:`<div class="panel pet locked"><div class="lockmark">🔒</div><h3>???</h3><b>Unknown Companion</b><p>A household ally waits somewhere beyond a major victory.</p></div>`}).join('')}</div></section>`;
if(state.tab==='Inventory')h=`<section><div class="section-title"><div><div class="eyebrow">Shared Stash</div><h2>Inventory & Spellbook</h2></div><button class="action muted-btn" onclick="resetDemo()">Reset Prototype</button></div><div class="grid2"><div>${state.players.map((p,pi)=>`<div class="panel" style="margin-bottom:12px"><h3>${p.name}</h3><p>Weapon: <b>${p.weapon||'None'}</b><br>Armor: <b>${p.armor||'None'}</b><br>Spell: <b>${p.spell||'None'}</b></p></div>`).join('')}</div><div class="cards">${state.bag.map((n,idx)=>{let it=item(n),eq=state.players.some(p=>p.weapon===n||p.armor===n||p.spell===n);return `<div class="panel loot ${eq?'equipped':''}"><div>${it.icon}</div><div><h3>${n}${eq?'<span class="pill">Equipped</span>':''}</h3><p>${it.type} • power ${it.power}</p>${['weapon','armor','spell'].includes(it.type)?`<div class="item-equip"><button onclick="equipItem('${n.replaceAll("'","\\'")}',0)">Equip: ${state.players[0].name}</button> <button onclick="equipItem('${n.replaceAll("'","\\'")}',1)">Equip: ${state.players[1].name}</button></div>`:''}</div></div>`}).join('')}</div></div></section>`;document.getElementById('view').innerHTML=h}ensureHP();render();
</script></body></html>
